name: Refresh profile releases

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate recent releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recent-releases.mjs profile/README.md
      - name: Commit when changed
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "No new releases."
            exit 0
          fi
          git config user.name "crewloom-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "docs(profile): refresh recent releases"
          git push
